[tool.ruff]
# Agentic OS — Ruff Linting Configuration
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "SIM", # flake8-simplify
]
ignore = [
    "E402",    # module-import-not-at-top-of-file (FastAPI late imports, conditional backends)
    "E501",    # line too long (handled by formatter)
    "E701",    # multiple-statements-on-one-line-colon (style preference, not a bug)
    "E741",    # ambiguous-variable-name (l, O, I used intentionally in math/data contexts)
    "N802",    # invalid-function-name (FastAPI route decorators)
    "N805",    # invalid-first-argument-name-for-method (Pydantic models)
    "N806",    # non-lowercase-variable-in-function (API constants like BASE, HDR)
    "N814",    # camelcase-imported-as-constant (MIMEMultipart etc.)
    "N817",    # camelcase-imported-as-acronym
    "S101",    # use of assert (allowed in tests)
    "S102",    # exec-builtin (intentional in terminal/compiler routers)
    "S104",    # hardcoded-bind-all-interfaces (server must bind 0.0.0.0)
    "S110",    # try-except-pass (already narrowed where possible)
    "S307",    # suspicious-eval-usage (intentional in compiler router)
    "S311",    # suspicious-non-cryptographic-random-usage (UI jitter, not crypto)
    "S314",    # suspicious-xml-element-tree-usage (XML parsing, not security)
    "S324",    # hashlib-insecure-hash-function (SHA-1 used for non-security hashing)
    "S602",    # subprocess-popen-with-shell-equals-true (intentional in terminal)
    "S603",    # subprocess-without-shell-equals-true (intentional)
    "S607",    # start-process-with-partial-path (intentional)
    "S608",    # hardcoded-sql-expression (SQLite queries are the data layer)
    "T201",    # print found (allowed in CLI)
    "B008",    # function call in default argument (FastAPI Depends)
    "SIM105",  # suppressible-exception (contextlib.suppress not always clearer)
    "SIM102",  # collapsible-if (nested ifs are sometimes more readable)
    "SIM108",  # use ternary operator (not always clearer)
    "SIM117",  # multiple-with-statements (separate withs for clarity)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T201", "S105", "S106"]
"run.py" = ["T201"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

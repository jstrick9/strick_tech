<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Chat</title><script src='https://cdn.tailwindcss.com'></script><style>body{background:#08090e;color:#e8f0ff;font-family:Inter,system-ui,sans-serif}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#1a2040;border-radius:99px}</style></head><body class='flex h-screen'><aside class='w-64 bg-[#0d1020] border-r border-white/10 flex flex-col'><div class='p-4 border-b border-white/10'><div class='flex items-center gap-3 mb-3'><div class='w-9 h-9 rounded-full bg-blue-500 flex items-center justify-center font-bold'>J</div><div><div class='font-semibold text-sm'>jstrick9</div><div class='text-xs text-green-400'>● Online</div></div></div><input placeholder='Search messages…' class='w-full bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500/50 transition'></div><div class='flex-1 overflow-y-auto p-2'><div class='text-xs text-gray-500 px-2 py-1 uppercase tracking-wider mb-1'>Direct Messages</div><div class='flex items-center gap-3 px-3 py-2 rounded-xl bg-blue-500/20 cursor-pointer'><div class='w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-sm font-bold'>B</div><div><div class='text-sm font-semibold'>Brain Agent</div><div class='text-xs text-gray-400 truncate'>Ready to help…</div></div><div class='w-2 h-2 rounded-full bg-blue-500 ml-auto flex-shrink-0'></div></div><div class='flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-white/5 cursor-pointer mt-1'><div class='w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-sm font-bold'>R</div><div><div class='text-sm font-semibold'>Researcher</div><div class='text-xs text-gray-400'>Idle</div></div></div></div></aside><main class='flex-1 flex flex-col'><div class='flex items-center gap-3 px-6 py-4 border-b border-white/10 bg-[#0a0b12]'><div class='w-9 h-9 rounded-full bg-purple-500 flex items-center justify-center font-bold'>B</div><div><div class='font-semibold'>Brain Agent</div><div class='text-xs text-green-400'>● Active now</div></div></div><div class='flex-1 overflow-y-auto p-6 space-y-4' id='msgs'><div class='flex gap-3'><div class='w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-sm font-bold flex-shrink-0'>B</div><div class='max-w-xs lg:max-w-md'><div class='bg-[#0d1020] border border-white/10 rounded-2xl rounded-tl-sm px-4 py-3 text-sm'>Hey! How can I help you build something amazing today? 🚀</div><div class='text-xs text-gray-600 mt-1 ml-1'>10:30 AM</div></div></div></div><div id='typing' class='hidden px-6 py-2 text-sm text-gray-500 italic'>Brain is typing…</div><div class='px-6 py-4 border-t border-white/10'><div class='flex items-center gap-3 bg-[#0d1020] border border-white/10 rounded-2xl px-4 py-3'><button class='text-gray-500 hover:text-white transition text-xl'>📎</button><input id='msgInput' placeholder='Message Brain Agent…' class='flex-1 bg-transparent text-white placeholder-gray-600 text-sm focus:outline-none' onkeydown="if(event.key==='Enter')sendMsg()"><button class='text-gray-500 hover:text-white transition text-xl'>😊</button><button onclick='sendMsg()' class='bg-blue-500 text-white w-8 h-8 rounded-xl flex items-center justify-center hover:bg-blue-400 transition flex-shrink-0'>→</button></div></div></main><script>const replies=['Great question! Let me think about that…','I can help you build that! What framework do you prefer?','Interesting idea. Here is my analysis…','Done! Check the preview pane for the result.','I found some relevant context in your Memory Galaxy.','Running the swarm now — 4 agents analyzing your request…'];let c=0;function sendMsg(){const i=document.getElementById('msgInput');const t=i.value.trim();if(!t)return;i.value='';const m=document.getElementById('msgs');m.innerHTML+=`<div class='flex gap-3 flex-row-reverse'><div class='w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-sm font-bold flex-shrink-0'>J</div><div class='max-w-xs lg:max-w-md'><div class='bg-blue-500 rounded-2xl rounded-tr-sm px-4 py-3 text-sm'>${t}</div><div class='text-xs text-gray-600 mt-1 mr-1 text-right'>Now</div></div></div>`;m.scrollTop=m.scrollHeight;const typing=document.getElementById('typing');typing.classList.remove('hidden');setTimeout(()=>{typing.classList.add('hidden');m.innerHTML+=`<div class='flex gap-3'><div class='w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-sm font-bold flex-shrink-0'>B</div><div class='max-w-xs lg:max-w-md'><div class='bg-[#0d1020] border border-white/10 rounded-2xl rounded-tl-sm px-4 py-3 text-sm'>${replies[c++%replies.length]}</div><div class='text-xs text-gray-600 mt-1 ml-1'>Now</div></div></div>`;m.scrollTop=m.scrollHeight;},1200+Math.random()*800);}</script></body></html>

<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Invoice Generator</title><script src='https://cdn.tailwindcss.com'></script><style>body{background:#f0f4ff;color:#0d1020;font-family:Inter,system-ui,sans-serif}@media print{.no-print{display:none!important}body{background:white}}</style></head><body class='p-6'><div class='max-w-3xl mx-auto'><div class='flex justify-between mb-6 no-print'><h1 class='text-2xl font-black text-[#0d1020]'>📄 Invoice Generator</h1><div class='flex gap-2'><button onclick='addLine()' class='border border-[#0d1020]/20 px-4 py-2 rounded-xl text-sm hover:bg-[#0d1020]/5 transition'>+ Add item</button><button onclick='window.print()' class='bg-green-500 text-white font-bold px-4 py-2 rounded-xl text-sm hover:bg-green-400 transition'>🖨️ Print / PDF</button></div></div><div class='bg-white rounded-2xl shadow-xl p-8'><div class='flex justify-between mb-10'><div><div class='font-black text-2xl mb-1'>Your Company</div><div class='text-gray-400 text-sm'>123 Main Street<br>Charlotte, NC 28201<br>you@company.com</div></div><div class='text-right'><div class='text-3xl font-black text-green-600 mb-1'>INVOICE</div><div class='text-gray-400 text-sm'>#INV-<input id='invNum' value='001' class='w-12 border-b border-gray-300 bg-transparent text-right focus:outline-none font-bold'></div><div class='text-gray-400 text-sm mt-1'>Date: <input type='date' class='border-b border-gray-300 bg-transparent focus:outline-none text-sm'></div></div></div><div class='mb-8'><div class='text-xs font-bold text-gray-400 uppercase tracking-wider mb-2'>Bill To</div><input placeholder='Client name' class='block font-bold text-lg border-b border-gray-200 w-full mb-1 focus:outline-none focus:border-green-500'><input placeholder='Client email' class='block text-sm text-gray-400 border-b border-gray-200 w-full focus:outline-none focus:border-green-500'></div><table class='w-full mb-6'><thead><tr class='border-b-2 border-gray-200'><th class='text-left pb-2 text-xs uppercase text-gray-400'>Description</th><th class='text-right pb-2 text-xs uppercase text-gray-400 w-20'>Qty</th><th class='text-right pb-2 text-xs uppercase text-gray-400 w-28'>Rate</th><th class='text-right pb-2 text-xs uppercase text-gray-400 w-28'>Amount</th><th class='w-8 no-print'></th></tr></thead><tbody id='lines'></tbody></table><div class='flex justify-end'><div class='w-60'><div class='flex justify-between py-2 text-sm'><span class='text-gray-400'>Subtotal</span><span id='subtotal' class='font-semibold'>$0.00</span></div><div class='flex justify-between py-2 text-sm'><span class='text-gray-400'>Tax (10%)</span><span id='tax' class='font-semibold'>$0.00</span></div><div class='flex justify-between py-2 border-t-2 border-gray-800 mt-1'><span class='font-black'>Total</span><span id='total' class='font-black text-lg text-green-600'>$0.00</span></div></div></div></div></div><script>let lines=[];function addLine(){lines.push({desc:'Service item',qty:1,rate:100});renderLines();}function renderLines(){const tb=document.getElementById('lines');tb.innerHTML=lines.map((l,i)=>`<tr class='border-b border-gray-100'><td class='py-2 pr-2'><input value='${l.desc}' oninput='lines[${i}].desc=this.value' class='w-full border-b border-transparent focus:border-green-400 focus:outline-none text-sm'></td><td class='py-2 px-1'><input type='number' value='${l.qty}' oninput='lines[${i}].qty=+this.value;calc()' class='w-full text-right border-b border-transparent focus:border-green-400 focus:outline-none text-sm'></td><td class='py-2 px-1'><input type='number' value='${l.rate}' oninput='lines[${i}].rate=+this.value;calc()' class='w-full text-right border-b border-transparent focus:border-green-400 focus:outline-none text-sm'></td><td class='py-2 pl-2 text-right text-sm font-semibold'>$${(l.qty*l.rate).toFixed(2)}</td><td class='no-print'><button onclick='lines.splice(${i},1);renderLines();calc()' class='text-red-400 hover:text-red-600 text-xs ml-1'>✕</button></td></tr>`).join('');calc();}function calc(){const s=lines.reduce((a,l)=>a+l.qty*l.rate,0);const t=s*.1;document.getElementById('subtotal').textContent='$'+s.toFixed(2);document.getElementById('tax').textContent='$'+t.toFixed(2);document.getElementById('total').textContent='$'+(s+t).toFixed(2);}addLine();addLine();</script></body></html>

<!DOCTYPE html><html><head><meta charset='UTF-8'><title>URL Shortener</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-[#08090e] text-white min-h-screen flex items-center justify-center p-4'><div class='w-full max-w-lg'><div class='text-center mb-10'><div class='text-5xl mb-3'>🔗</div><h1 class='text-4xl font-black mb-2'>Shorten URLs</h1><p class='text-gray-400'>Make long links short and shareable</p></div><div class='bg-[#0d1020] border border-white/10 rounded-2xl p-6'><div class='flex gap-3 mb-6'><input id='urlInput' type='url' placeholder='https://your-very-long-url.com/with/many/params?and=values' class='flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:border-teal-500/50 focus:outline-none transition text-sm'><button onclick='shortenUrl()' class='bg-teal-500 hover:bg-teal-400 text-[#08090e] font-bold px-5 py-3 rounded-xl transition whitespace-nowrap'>Shorten</button></div><div id='result' class='hidden'><div class='flex items-center gap-3 bg-teal-500/10 border border-teal-500/20 rounded-xl p-4'><div class='flex-1'><div class='text-xs text-gray-400 mb-1'>Shortened URL</div><div class='font-mono text-teal-300 font-bold' id='shortUrl'>agos.link/abc123</div></div><button onclick='copyShort()' class='bg-teal-500/20 text-teal-300 px-3 py-2 rounded-lg text-sm hover:bg-teal-500/30 transition'>Copy</button></div></div><div class='mt-4'><div class='text-xs text-gray-500 mb-2 uppercase tracking-wider font-semibold'>Recent links</div><div id='history' class='space-y-2'><div class='flex items-center gap-3 text-sm py-2 border-b border-white/5'><span class='text-teal-400 font-mono'>agos.link/demo</span><span class='text-gray-500 flex-1 truncate'>→ https://example.com/demo</span><span class='text-gray-600 text-xs'>42 clicks</span></div></div></div></div></div><script>let links=[];function shortenUrl(){const u=document.getElementById('urlInput').value;if(!u)return;const id=Math.random().toString(36).slice(2,8);const short='agos.link/'+id;links.unshift({short,original:u,clicks:0});document.getElementById('shortUrl').textContent=short;document.getElementById('result').classList.remove('hidden');renderHistory();}function copyShort(){const t=document.getElementById('shortUrl').textContent;navigator.clipboard.writeText(t).then(()=>alert('Copied!'));}function renderHistory(){const h=document.getElementById('history');h.innerHTML=links.map(l=>`<div class='flex items-center gap-3 text-sm py-2 border-b border-white/5'><span class='text-teal-400 font-mono flex-shrink-0'>${l.short}</span><span class='text-gray-500 flex-1 truncate'>→ ${l.original}</span><span class='text-gray-600 text-xs'>${l.clicks} clicks</span></div>`).join('');}</script></body></html>

<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Weather</title><script src='https://cdn.tailwindcss.com'></script><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.float{animation:float 3s ease-in-out infinite}body{background:linear-gradient(135deg,#0a0f2e,#1a0a2e);min-height:100vh;color:white;font-family:Inter,system-ui,sans-serif}</style></head><body class='flex items-center justify-center p-6'><div class='w-full max-w-sm'><div class='bg-white/10 backdrop-blur border border-white/20 rounded-3xl p-6'><div class='flex items-center gap-3 mb-6'><input id='cityInput' placeholder='Search city…' class='flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-2.5 text-white placeholder-white/40 focus:outline-none text-sm' onkeydown="if(event.key==='Enter')search()" value='Charlotte, NC'><button onclick='search()' class='bg-yellow-400 text-black font-bold px-4 py-2.5 rounded-xl text-sm'>Go</button></div><div class='text-center mb-6'><div id='icon' class='text-8xl mb-3 float'>🌤️</div><div class='text-5xl font-black mb-1' id='temp'>72°F</div><div class='text-white/70 text-lg' id='desc'>Partly Cloudy</div><div class='text-white/50 text-sm mt-1' id='city'>Charlotte, NC</div></div><div class='grid grid-cols-3 gap-3 mb-6'><div class='bg-white/10 rounded-xl p-3 text-center'><div class='text-xs text-white/50 mb-1'>Humidity</div><div class='font-bold' id='hum'>62%</div></div><div class='bg-white/10 rounded-xl p-3 text-center'><div class='text-xs text-white/50 mb-1'>Wind</div><div class='font-bold' id='wind'>8 mph</div></div><div class='bg-white/10 rounded-xl p-3 text-center'><div class='text-xs text-white/50 mb-1'>UV Index</div><div class='font-bold' id='uv'>4</div></div></div><div class='space-y-2'><div class='text-xs text-white/50 uppercase tracking-wider mb-2'>5-Day Forecast</div><div id='forecast' class='space-y-2'></div></div></div></div><script>const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const icons=['☀️','🌤️','⛅','🌧️','⛈️'];const cities={charlotte:{temp:72,desc:'Partly Cloudy',hum:'62%',wind:'8 mph',uv:'4',icon:'🌤️'},london:{temp:58,desc:'Overcast',hum:'78%',wind:'12 mph',uv:'2',icon:'⛅'},tokyo:{temp:81,desc:'Sunny',hum:'55%',wind:'6 mph',uv:'7',icon:'☀️'},sydney:{temp:68,desc:'Clear',hum:'48%',wind:'14 mph',uv:'6',icon:'☀️'}};function search(){const c=document.getElementById('cityInput').value.toLowerCase().replace(/[,\s]+/g,'');const d=cities[c]||{temp:Math.floor(60+Math.random()*30),desc:'Partly Cloudy',hum:Math.floor(40+Math.random()*40)+'%',wind:Math.floor(5+Math.random()*15)+' mph',uv:Math.floor(1+Math.random()*9)+'',icon:icons[Math.floor(Math.random()*icons.length)]};document.getElementById('temp').textContent=d.temp+'°F';document.getElementById('desc').textContent=d.desc;document.getElementById('hum').textContent=d.hum;document.getElementById('wind').textContent=d.wind;document.getElementById('uv').textContent=d.uv;document.getElementById('icon').textContent=d.icon;document.getElementById('city').textContent=document.getElementById('cityInput').value||'Your City';renderForecast();}function renderForecast(){const today=new Date().getDay();document.getElementById('forecast').innerHTML=[1,2,3,4,5].map(i=>`<div class='flex items-center justify-between bg-white/5 rounded-xl px-4 py-2'><span class='text-sm text-white/70 w-10'>${days[(today+i)%7]}</span><span class='text-xl'>${icons[Math.floor(Math.random()*3)]}</span><span class='font-semibold text-sm'>${Math.floor(60+Math.random()*20)}°</span></div>`).join('');}search();</script></body></html>
